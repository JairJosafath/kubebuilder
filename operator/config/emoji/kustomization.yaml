# Optional deployment overlay. Create the jev-api Secret before applying.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../default
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: controller-manager
      spec:
        template:
          spec:
            containers:
              - name: manager
                env:
                  - name: JEV_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: jev-api
                        key: JEV_API_KEY
