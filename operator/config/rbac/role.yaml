---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - super.elp-max.com
  resources:
  - superpods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - super.elp-max.com
  resources:
  - superpods/finalizers
  verbs:
  - update
- apiGroups:
  - super.elp-max.com
  resources:
  - superpods/status
  verbs:
  - get
  - patch
  - update
