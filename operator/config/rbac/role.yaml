---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - pods
  - serviceaccounts
  - services
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - super.elp-max.com
  resources:
  - superpods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - super.elp-max.com
  resources:
  - superpods/finalizers
  verbs:
  - update
- apiGroups:
  - super.elp-max.com
  resources:
  - superpods/status
  verbs:
  - get
  - patch
  - update
